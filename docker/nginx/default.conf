# Reuse the client's X-Request-Id when present, otherwise use nginx's own id.
# Laravel validates the value again and generates a new one if it is malformed.
map $http_x_request_id $correlation_id {
    default $http_x_request_id;
    ""      $request_id;
}

log_format json_combined escape=json
    '{"time":"$time_iso8601","request_id":"$correlation_id","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"bytes_sent":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time","user_agent":"$http_user_agent"}';

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    access_log /dev/stdout json_combined;
    error_log /dev/stderr warn;

    # Resolve the app container via Docker DNS at request time, so recreating it
    # does not leave nginx pointing at a stale IP (502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;

    client_max_body_size 12m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass $php_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_X_REQUEST_ID $correlation_id;
        # nginx is the edge in local dev: never pass on a client-supplied X-Forwarded-For.
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_hide_header X-Powered-By;
        internal;
    }

    # Never execute any other PHP file, never serve dotfiles.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }
}
