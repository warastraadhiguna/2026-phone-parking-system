; Application PHP settings (all environments).
date.timezone = UTC
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M
expose_php = Off

; Keep logs on stderr so `docker compose logs` shows them.
log_errors = On
error_log = /proc/self/fd/2

opcache.enable = 1
opcache.enable_cli = 0
; Development: re-check file timestamps so edits apply immediately.
opcache.validate_timestamps = 1
