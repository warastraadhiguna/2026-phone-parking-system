org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Backend base URL per build type. Override locally (e.g. a LAN IP for a real phone) in
# ~/.gradle/gradle.properties or with -PpatiApiBaseUrlDebug=... — never commit real endpoints.
# 10.0.2.2 is the host machine as seen from the Android emulator (docker nginx on :8080).
patiApiBaseUrlDebug=http://10.0.2.2:8080/
patiApiBaseUrlRelease=https://parkir.example.invalid/
