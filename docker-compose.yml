# Local development environment. NOT a production deployment.
# Passwords below are local-only defaults; override them in a root .env file if needed.
name: pati-parking

x-backend: &backend
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: dev
  image: pati-parking/php:dev
  volumes:
    - ./backend:/var/www/html
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *backend

  queue:
    <<: *backend
    command: ["php", "artisan", "queue:work", "redis", "--tries=3", "--backoff=10", "--max-time=3600"]

  scheduler:
    <<: *backend
    command: ["php", "artisan", "schedule:work"]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/v1/health/live > /dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pati_parking
      POSTGRES_USER: pati
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pati_local_dev_only}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pati -d pati_parking"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Frontend tooling (Vite / TypeScript). Start with: docker compose --profile tools up node
  node:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports:
      - "5173:5173"
    profiles: ["tools"]

volumes:
  pgdata:
  redisdata:
